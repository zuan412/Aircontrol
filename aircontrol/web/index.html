<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Aircontrol - iPhone Mirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="/viewer.css">
</head>
<body class="theme-dark">
  <div id="app-viewport">
    <!-- iPhone Device Chassis -->
    <div id="iphone-chassis" class="iphone-chassis">
      
      <!-- Hardware Physical Side Buttons -->
      <div id="side-left" class="chassis-side chassis-left">
        <button id="btn-action" class="hw-btn hw-action" title="Action / Ringer (Ctrl+\)" data-button="mute">
          <span class="hw-pill"></span>
        </button>
        <button id="btn-volup" class="hw-btn hw-volup" title="Tăng Âm Lượng (Ctrl+Up)" data-button="volume-up">
          <span class="hw-pill"></span>
        </button>
        <button id="btn-voldown" class="hw-btn hw-voldown" title="Giảm Âm Lượng (Ctrl+Down)" data-button="volume-down">
          <span class="hw-pill"></span>
        </button>
      </div>

      <div id="side-right" class="chassis-side chassis-right">
        <button id="btn-power" class="hw-btn hw-power" title="Nguồn / Khóa Máy (Ctrl+L)" data-button="power">
          <span class="hw-pill"></span>
        </button>
      </div>

      <!-- Titanium Bezel & Screen Outer Frame -->
      <div id="iphone-bezel" class="iphone-bezel">
        
        <!-- Dynamic Island -->
        <div id="dynamic-island" class="dynamic-island" title="Dynamic Island">
          <div class="island-camera"></div>
          <div class="island-sensor"></div>
        </div>

        <!-- Canvas Display Viewport -->
        <div id="display-container" class="display-container">
          <canvas id="screen-canvas" width="1170" height="2532"></canvas>
          
          <!-- Connection / Standby Overlay -->
          <div id="standby-overlay" class="standby-overlay active">
            <div class="spinner"></div>
            <div class="standby-text">Đang kết nối với iPhone...</div>
            <div class="standby-sub">Cắm cáp USB hoặc bật Wi-Fi cùng mạng LAN</div>
          </div>
        </div>

        <!-- iOS Home Indicator Bar -->
        <div id="home-indicator-wrap" class="home-indicator-wrap">
          <div id="home-indicator" class="home-indicator" title="Màn hình chính (Ctrl+H)"></div>
        </div>

      </div>
    </div>

    <!-- Sleek Acrylic Toolbar -->
    <aside id="acrylic-toolbar" class="acrylic-toolbar">
      <button id="tb-screenshot" class="tb-btn" title="Chụp ảnh màn hình iPhone (Ctrl+P)">Chụp Ảnh</button>
      <button id="tb-rotate" class="tb-btn" title="Xoay màn hình 90° (Ctrl+R)">Xoay Màn</button>
      <button id="tb-sound" class="tb-btn" title="Bật/Tắt âm thanh từ iPhone (Ctrl+M)">Âm Thanh</button>
      <button id="tb-hud" class="tb-btn" title="Bật/Tắt hiển thị thông số hiệu năng (Ctrl+I)">HUD FPS</button>
      <button id="tb-reconnect" class="tb-btn" title="Làm mới kết nối thiết bị">Kết Nối Lại</button>
    </aside>

    <!-- Floating Telemetry HUD -->
    <div id="telemetry-hud" class="telemetry-hud hidden">
      <div class="hud-item"><span class="hud-label">FPS:</span> <span id="hud-fps" class="hud-val">0</span></div>
      <div class="hud-item"><span class="hud-label">Giải mã:</span> <span id="hud-codec" class="hud-val">D3D11</span></div>
      <div class="hud-item"><span class="hud-label">Độ phân giải:</span> <span id="hud-res" class="hud-val">Chờ...</span></div>
    </div>
  </div>

  <script src="/viewer.js"></script>
</body>
</html>
