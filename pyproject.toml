[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aircontrol"
version = "0.1.0"
description = "Bespoke Windows screen mirroring and interactive remote control for iPhone"
readme = "README.md"
authors = [{ name = "Antigravity Pair" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "pymobiledevice3>=4.0.0",
    "av>=10.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
aircontrol = "aircontrol.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aircontrol*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
